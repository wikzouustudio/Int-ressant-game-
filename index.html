<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Minou Chaos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#24122f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minou Chaos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout : une scène WebGL plein écran, un calque 2D pour les textes flottants, et des calques HTML (menus, HUD) par-dessus. */
:root{
  --night:#24122f;      /* fond des panneaux */
  --plum:#3b1f4f;       /* surface */
  --plum-2:#4e2a66;     /* surface haute */
  --cream:#fff4e3;      /* texte */
  --muted:#cdb6d9;      /* texte secondaire */
  --tang:#ff8a3d;       /* accent : bouton jouer, chat roux */
  --tang-d:#d9601b;
  --mint:#5ef2c2;       /* succès */
  --gold:#ffd23f;       /* monnaie, record */
  --danger:#ff4d6d;     /* grillé */
  --f-display:"Lilita One","Baloo 2",system-ui,sans-serif;
  --f-body:"Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--cream);font-family:var(--f-body);
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#cv,#ov{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{pointer-events:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}

.layer{position:fixed;inset:0;display:flex;flex-direction:column;pointer-events:none;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.layer>*{pointer-events:auto}
.wrap{width:100%;max-width:480px;margin:0 auto}

/* ---------- MENU ---------- */
#menu{justify-content:space-between}
.topbar{display:flex;align-items:center;gap:8px;padding-block:10px}
.pill{display:flex;align-items:center;gap:6px;background:rgba(36,18,47,.82);border:2px solid rgba(255,255,255,.12);
  border-radius:999px;padding:4px 12px 4px 8px;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;backdrop-filter:blur(6px)}
.pill .ic{font-size:20px}
.spacer{flex:1}
.icon-btn{width:44px;height:44px;border-radius:14px;background:rgba(36,18,47,.82);border:2px solid rgba(255,255,255,.12);
  font-size:20px;display:grid;place-items:center;position:relative;backdrop-filter:blur(6px)}
.icon-btn.off{opacity:.45}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--danger);
  color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}

.title{text-align:center;margin-top:2px}
.logo{font-family:var(--f-display);font-weight:400;font-size:clamp(46px,14vw,64px);line-height:.9;letter-spacing:1px;margin:0;
  color:var(--cream);text-shadow:0 4px 0 var(--tang-d),0 8px 0 rgba(0,0,0,.25)}
.logo span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.logo .b{color:var(--tang);text-shadow:0 4px 0 #8a2f00,0 8px 0 rgba(0,0,0,.25)}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.tagline{display:inline-block;font-weight:700;font-size:15px;color:var(--cream);margin:8px 0 0;padding:2px 14px;
  background:rgba(36,18,47,.78);border-radius:999px}

.bottom{display:flex;flex-direction:column;gap:10px;padding-block:10px 14px}
.room-card{display:flex;align-items:center;gap:8px;background:rgba(36,18,47,.88);border:2px solid rgba(255,255,255,.12);
  border-radius:20px;padding:8px;backdrop-filter:blur(6px)}
.room-card .arrow{width:42px;height:42px;border-radius:12px;background:var(--plum-2);font-size:20px;font-weight:800}
.room-card .arrow:disabled{opacity:.3}
.room-info{flex:1;text-align:center;min-width:0}
.room-name{font-family:var(--f-display);font-size:22px;letter-spacing:.5px}
.room-sub{font-size:13px;color:var(--muted);font-weight:700;line-height:1.2}
.big-btn{width:100%;font-family:var(--f-display);font-size:34px;letter-spacing:1px;padding:12px 0 10px;border-radius:22px;
  background:var(--tang);color:#fff;text-shadow:0 3px 0 var(--tang-d);box-shadow:0 7px 0 var(--tang-d),0 12px 24px rgba(0,0,0,.35);
  transition:transform .08s}
.big-btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--tang-d)}
.big-btn:disabled{filter:grayscale(1);opacity:.6}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mid-btn{position:relative;font-weight:800;font-size:18px;padding:11px 0;border-radius:18px;background:var(--plum-2);
  box-shadow:0 5px 0 #2a1438;display:flex;align-items:center;justify-content:center;gap:8px}
.mid-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2a1438}
.foot{text-align:center;font-size:13px;color:var(--cream);font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.6)}

/* ---------- HUD ---------- */
#hud{pointer-events:none}
#hud>*{pointer-events:none}
.hud-top{display:flex;align-items:flex-start;gap:8px;padding-block:10px 0}
#lives{font-size:24px;letter-spacing:-2px;min-width:90px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.score-box{flex:1;text-align:center}
#score{font-family:var(--f-display);font-size:40px;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
#best{font-size:13px;font-weight:800;color:var(--cream);opacity:.9;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#pauseBtn{pointer-events:auto}
.meter{display:flex;align-items:center;gap:8px;margin-top:6px}
.meter-label{font-family:var(--f-display);font-size:13px;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.4);width:64px;flex:none}
.meter-bar{flex:1;height:12px;border-radius:8px;background:rgba(36,18,47,.75);border:2px solid rgba(255,255,255,.18);overflow:hidden}
.meter-bar>div{height:100%;width:0;border-radius:6px;transition:width .2s}
#chaosFill{background:linear-gradient(90deg,var(--tang),var(--gold))}
#chaosFill.fever{background:linear-gradient(90deg,#ff4d6d,#ffd23f,#5ef2c2,#6fa8ff,#c86bff);background-size:200% 100%;animation:rb .6s linear infinite}
#parFill{background:linear-gradient(90deg,#ffb36b,#ff4d6d)}
#parMult{font-family:var(--f-display);font-size:15px;color:#ff8fa3;width:40px;text-align:right;text-shadow:0 2px 0 rgba(0,0,0,.4)}
@keyframes rb{to{background-position:200% 0}}
#combo{align-self:center;margin-top:8px;font-family:var(--f-display);font-size:26px;color:var(--gold);
  text-shadow:0 3px 0 #a05a00;opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s}
#combo.on{opacity:1;transform:scale(1)}
#combo.bump{animation:bump .25s}
@keyframes bump{40%{transform:scale(1.35) rotate(-4deg)}}
#intro{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);width:min(calc(100% - 32px),380px);
  background:rgba(36,18,47,.94);border:2px solid var(--gold);border-radius:20px;padding:10px 14px;text-align:center;pointer-events:none;z-index:40;animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
#intro .ib-k{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--mint)}
#intro .ib-t{font-family:var(--f-display);font-size:24px;color:var(--gold);line-height:1.1}
#intro .ib-d{font-weight:700;font-size:15px;line-height:1.25;text-wrap:balance}

/* ---------- SHEETS & MODALS ---------- */
.dim{position:fixed;inset:0;background:rgba(15,6,22,.62);display:flex;align-items:flex-end;justify-content:center;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  animation:fade .18s}
.dim.center{align-items:center;padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:480px;max-height:86%;background:var(--plum);border-radius:26px 26px 0 0;
  display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .25s cubic-bezier(.2,1.3,.4,1);
  border:2px solid rgba(255,255,255,.1);border-bottom:0}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.sheet-head h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;flex:1;letter-spacing:.5px}
.close{width:40px;height:40px;border-radius:12px;background:var(--plum-2);font-size:18px;font-weight:800}
.tabs{display:flex;gap:6px;padding:0 16px 10px}
.tab{flex:1;padding:8px 0;border-radius:12px;background:var(--night);font-weight:800;font-size:15px;color:var(--muted)}
.tab.on{background:var(--tang);color:#fff}
.list{overflow-y:auto;padding:4px 16px 18px;display:flex;flex-direction:column;gap:10px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{background:var(--night);border-radius:18px;padding:12px;display:flex;align-items:center;gap:12px;border:2px solid transparent}
.item .em{font-size:32px;width:44px;text-align:center;flex:none}
.item .tx{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:17px;line-height:1.15}
.item .ds{font-size:13px;color:var(--muted);font-weight:600;line-height:1.25}
.lv{display:flex;gap:3px;margin-top:4px}
.lv i{width:14px;height:6px;border-radius:3px;background:rgba(255,255,255,.15)}
.lv i.f{background:var(--mint)}
.buy{flex:none;min-width:84px;padding:8px 10px;border-radius:12px;background:var(--gold);color:#3a2300;font-weight:800;font-size:15px;
  box-shadow:0 3px 0 #b88a00}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #b88a00}
.buy:disabled{background:var(--plum-2);color:var(--muted);box-shadow:none}
.buy.eqb{background:var(--mint);color:#08392b;box-shadow:0 3px 0 #2aa883}
.tile{background:var(--night);border-radius:18px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;
  border:2px solid transparent;text-align:center;min-width:0}
.tile.eq{border-color:var(--mint)}
.tile img{width:100%;max-width:110px;aspect-ratio:228/192;height:auto;display:block}
.tile .nm{font-weight:800;font-size:13px;line-height:1.1;min-height:28px;display:grid;place-items:center}
.tile .buy{min-width:0;width:100%;font-size:13px;padding:6px 4px}

.mis{background:var(--night);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mis .top{display:flex;gap:10px;align-items:center}
.mis .nm{flex:1;font-weight:800;font-size:16px;line-height:1.2}
.mis .rw{font-weight:800;color:var(--gold);white-space:nowrap}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--mint);border-radius:6px}
.mis .st{font-size:13px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.note{text-align:center;color:var(--muted);font-weight:700;font-size:14px}

.card{width:100%;max-width:400px;background:var(--plum);border-radius:28px;padding:16px;text-align:center;
  border:2px solid rgba(255,255,255,.1);animation:pop .35s cubic-bezier(.2,1.5,.4,1);display:flex;flex-direction:column;gap:9px;
  max-height:calc(100% - 20px);overflow-y:auto;touch-action:pan-y}
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}}
.card{animation-name:popc}
@keyframes popc{from{transform:scale(.7);opacity:0}}
.card h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0;line-height:1.05;text-wrap:balance}
.card p{margin:0;font-weight:700;color:var(--muted);text-wrap:balance}
.chest{font-size:96px;line-height:1;display:inline-block}
.chest.shake{animation:shake .5s ease-in-out infinite}
@keyframes shake{20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
.streak{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.streak b{width:34px;height:34px;border-radius:10px;background:var(--night);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.streak b.d{background:var(--mint);color:#08392b}
.streak b.t{background:var(--gold);color:#3a2300;transform:scale(1.12)}
.reward{font-family:var(--f-display);font-size:40px;color:var(--gold);text-shadow:0 3px 0 #a05a00}

/* ---------- GAME OVER ---------- */
.over-score{font-family:var(--f-display);font-size:54px;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.record{display:inline-block;background:var(--gold);color:#3a2300;font-weight:800;border-radius:999px;padding:3px 14px;
  font-size:16px;animation:pulse .9s ease-in-out infinite}
.rank{font-family:var(--f-display);font-size:22px;color:var(--tang)}
.report{background:var(--night);border-radius:18px;padding:10px 14px;text-align:left}
.report h3{margin:0 0 6px;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.report .r{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:15px;padding:1px 0;border-bottom:1px dashed rgba(255,255,255,.1)}
.report .r b{font-variant-numeric:tabular-nums;white-space:nowrap}
.verdict{font-size:14px;color:var(--cream);font-weight:700;margin-top:8px;font-style:italic;opacity:.9}
.earn{font-family:var(--f-display);font-size:28px;color:var(--gold)}
.unlock{background:linear-gradient(90deg,var(--tang),#ff5f8f);color:#fff;border-radius:16px;padding:10px;font-weight:800}
.goal{font-size:14px;font-weight:700;color:var(--muted)}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.ghost{font-weight:800;font-size:17px;padding:10px 0;border-radius:16px;background:var(--plum-2)}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-30px);opacity:0;
  background:var(--mint);color:#08392b;font-weight:800;padding:10px 18px;border-radius:999px;z-index:50;pointer-events:none;
  transition:.25s;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
#loading{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:10px;font-family:var(--f-display);font-size:28px;background:var(--night);z-index:100;text-align:center;padding:0 24px}
#loading small{font-family:var(--f-body);font-size:15px;color:var(--muted);font-weight:700}

@media (prefers-reduced-motion:reduce){
  .logo span,.pulse,.record,.chest.shake{animation:none}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="ov"></canvas>

<!-- MENU -->
<div id="menu" class="layer" hidden>
  <div class="wrap">
    <div class="topbar">
      <div class="pill"><span class="ic">🐟</span><span id="mCoins">0</span></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="giftBtn" aria-label="Cadeau du jour">🎁<span class="badge pulse" id="giftBadge">!</span></button>
      <button class="icon-btn" id="sndBtn" aria-label="Bruitages">🔊</button>
      <button class="icon-btn" id="musBtn" aria-label="Musique">🎵</button>
    </div>
    <div class="title">
      <h1 class="logo"><span>MINOU</span><br><span class="b" style="animation-delay:.3s">CHAOS</span></h1>
      <p class="tagline">Fais tout tomber. Ne te fais pas griller.</p>
    </div>
  </div>
  <div class="wrap bottom">
    <div class="room-card">
      <button class="arrow" id="roomPrev" aria-label="Pièce précédente">◀</button>
      <div class="room-info"><div class="room-name" id="roomName">Le Salon</div><div class="room-sub" id="roomSub"></div></div>
      <button class="arrow" id="roomNext" aria-label="Pièce suivante">▶</button>
    </div>
    <button class="big-btn" id="playBtn">JOUER</button>
    <div class="row">
      <button class="mid-btn" id="shopBtn">🛍️ Boutique</button>
      <button class="mid-btn" id="misBtn">📋 Missions<span class="badge" id="misBadge" hidden>!</span></button>
    </div>
    <div class="foot" id="mFoot"></div>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="layer" hidden>
  <div class="wrap">
    <div class="hud-top">
      <div id="lives"></div>
      <div class="score-box"><div id="score">0</div><div id="best">Record 0</div></div>
      <button class="icon-btn" id="pauseBtn" aria-label="Pause">⏸</button>
    </div>
    <div class="meter"><div class="meter-label">CHAOS</div><div class="meter-bar"><div id="chaosFill"></div></div><div style="width:40px"></div></div>
    <div class="meter"><div class="meter-label">PARANO</div><div class="meter-bar"><div id="parFill"></div></div><div id="parMult">x1.0</div></div>
  </div>
  <div id="combo">x2</div>
</div>
<div id="intro" hidden><div class="ib-k">NOUVEAU PIÈGE</div><div class="ib-t"></div><div class="ib-d"></div></div>

<div id="sheetRoot"></div>
<div id="toast"></div>
<div id="loading"><div>Le chat s'étire…</div><small>Sculpture des modèles 3D</small></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
if(!window.THREE){$('#loading').textContent='Connexion nécessaire pour charger la 3D.';return}
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const fmt=n=>Math.round(n).toLocaleString('fr-FR');
const FONT='"Lilita One","Baloo 2",system-ui,sans-serif';
const EFONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d};

/* =================== DONNÉES =================== */
// m : modèle sculpté. fx : type d'éclats. w : poids (plus lourd = plus lent). eur : prix pour le rapport des dégâts.
const ROOMS=[
 {n:'Le Salon',need:0,wall:['#f7d9b5','#efc595'],wains:'#e3ad78',floor:'#9a6440',floor2:'#80522f',sofa:'#5867d8',cloth:'#c0392b',rug:'#d9534f',sky:['#8fd3ff','#d8f1ff'],frame:'🌅',
  objs:[
   {e:'☕',m:'cup',n:'Tasse',pts:40,eur:15,w:.7,fx:'shards',c:'#ffffff'},
   {e:'🏺',m:'vase',n:'Vase de Mamie',pts:120,eur:450,w:1.15,fx:'shards',c:'#d3803f'},
   {e:'🌵',m:'plant',n:'Cactus',pts:70,eur:35,w:1.05,fx:'dirt',c:'#c8673a'},
   {e:'🖼️',m:'frame',n:'Cadre',pts:90,eur:120,w:1,fx:'glass',c:'#c49a5a',pic:'🐱'},
   {e:'🕯️',m:'candle',n:'Bougie',pts:50,eur:20,w:.8,fx:'shards',c:'#fff1c9'},
   {e:'📚',m:'books',n:'Livres',pts:60,eur:60,w:1.3,fx:'paper',c:'#ffffff'},
   {e:'🎮',m:'pad',n:'Manette',pts:110,eur:70,w:.9,fx:'tech',c:'#444444'},
   {e:'🐠',m:'bowl',n:'Bocal',pts:80,eur:30,w:1.1,fx:'fish',c:'#7fd3ff',fish:1,rare:.08},
   {e:'⏰',m:'clock',n:'Réveil',pts:100,eur:25,w:.9,fx:'metal',c:'#ff5a5a',alarm:1,rare:.08},
  ]},

function seeded(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
function ensureDay(){
  const today=dayKey();
  if(save.today.day!==today)save.today={day:today,breaks:0,games:0};
  if(save.mis.day!==today||save.mis.list.some(m=>!MT.find(x=>x.k===m.k))){
    const r=seeded('minou'+today);const pool=MT.slice();const list=[];
    while(list.length<3){const i=Math.floor(r()*pool.length);const m=pool.splice(i,1)[0];
      const lv=Math.floor(r()*m.v.length);list.push({k:m.k,goal:m.v[lv],rw:m.r[lv],prog:0,claimed:false})}
    save.mis={day:today,list};persist();
  }
}

let AC=null,master,sfxG,musG,NB;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  master=AC.createGain();master.gain.value=.8;master.connect(AC.destination);
  sfxG=AC.createGain();sfxG.connect(master);musG=AC.createGain();musG.connect(master);
  applyVol();
  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  musicStart();
}
function applyVol(){if(!AC)return;sfxG.gain.value=save.sound?.9:0;musG.gain.value=save.music?.3:0}
function env(g,t,a,p,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function tone(type,f0,f1,dur,vol,when=0,dest){if(!AC)return;const t=AC.currentTime+when;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);env(g,t,.005,vol,dur);
  o.connect(g);g.connect(dest||sfxG);o.start(t);o.stop(t+dur+.06)}
function noise(dur,vol,ft,f0,f1,when=0,q=1,dest){if(!AC)return;const t=AC.currentTime+when;const s=AC.createBufferSource();s.buffer=NB;
  const f=AC.createBiquadFilter();f.type=ft;f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);f.Q.value=q;
  const g=AC.createGain();env(g,t,.003,vol,dur);s.connect(f);f.connect(g);g.connect(dest||sfxG);s.start(t,Math.random()*.5);s.stop(t+dur+.06)}
function sfx(n,o){
  if(!AC||!save.sound||(G&&G.demo&&n!=='click'))return;
  switch(n){
   case 'crash':{
     const fx=o||'shards';
     noise(.12,.6,'lowpass',500,120);
     if(['shards','glass','gold','wine','stone'].includes(fx)){noise(.45,.5,'highpass',2500,900);for(let i=0;i<5;i++)tone('sine',rand(2200,5200),null,.12,.07,i*.035+rand(0,.02))}
     if(fx==='metal'){tone('triangle',190,180,1,.35);tone('triangle',287,280,.9,.2);tone('sine',523,520,.7,.1)}
     if(['cake','egg','milk','melon','fish','dirt'].includes(fx)){noise(.3,.55,'lowpass',1400,180);tone('sine',220,60,.25,.3)}
     if(fx==='paper')noise(.5,.25,'bandpass',1800,900,0,.8);
     if(fx==='tech'){tone('square',900,120,.25,.12);noise(.3,.3,'highpass',3000,1500)}
     if(fx==='cosmic'){tone('sawtooth',300,40,.8,.25);noise(.9,.5,'lowpass',2500,100)}
     if(fx==='stone')tone('sine',90,40,.4,.5);
     break}
   case 'whoosh':noise(.22,.18,'bandpass',500,2200,0,2);break;
   case 'meow':{const t=AC.currentTime;const os=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();
     os.type='sawtooth';os.frequency.setValueAtTime(520,t);os.frequency.linearRampToValueAtTime(880,t+.12);os.frequency.linearRampToValueAtTime(480,t+.38);
     f.type='bandpass';f.frequency.setValueAtTime(900,t);f.frequency.linearRampToValueAtTime(1600,t+.15);f.frequency.linearRampToValueAtTime(700,t+.38);f.Q.value=3;
     env(g,t,.03,.35,.38);os.connect(f);f.connect(g);g.connect(sfxG);os.start(t);os.stop(t+.5);break}
   case 'hmm':tone('sine',170,250,.22,.3);tone('triangle',170,250,.22,.08);break;
   case 'look':tone('sawtooth',220,440,.14,.09);tone('square',660,null,.08,.06,.12);break;
   case 'tink':tone('sine',2400,2600,.08,.12);tone('sine',3200,null,.06,.06,.05);break;
   case 'beep':tone('square',880,null,.08,.08);break;
   case 'shutter':noise(.06,.5,'highpass',3000,6000);tone('square',1800,600,.05,.08,.03);break;
   case 'ring':for(let i=0;i<4;i++){tone('square',1300,null,.05,.06,i*.1);tone('square',1600,null,.05,.06,i*.1+.05)}break;
   case 'step':noise(.06,.18,'lowpass',400,120);break;
   case 'caught':tone('square',520,130,.55,.16);tone('sawtooth',260,65,.6,.1);break;
   case 'coin':tone('square',988,null,.07,.08);tone('square',1319,null,.12,.08,.07);break;
   case 'buy':[523,659,784,1047].forEach((f,i)=>tone('square',f,null,.1,.07,i*.06));break;
   case 'fever':[523,659,784,1047,1319,1568].forEach((f,i)=>tone('square',f,null,.12,.08,i*.05));noise(.6,.2,'highpass',4000,8000);break;
   case 'flush':noise(1.2,.35,'bandpass',600,2500,0,.7);break;
   case 'alarm':for(let i=0;i<6;i++)tone('square',1500,null,.06,.08,i*.11);break;
   case 'pop':tone('sine',380,760,.08,.18);break;
   case 'click':tone('sine',660,880,.05,.12);break;
   case 'combo':tone('triangle',440*Math.pow(2,Math.min(o,12)/12),null,.12,.12);break;
   case 'chest':[392,523,659,784,1047].forEach((f,i)=>tone('triangle',f,null,.18,.12,i*.08));break;
   case 'over':[392,370,349,262].forEach((f,i)=>tone('triangle',f,null,.28,.14,i*.2));break;

}

let musT=0,step=0,musTimer=null;
function musicStart(){if(!AC||musTimer)return;musT=AC.currentTime+.1;musTimer=setInterval(musTick,30)}
function musTick(){
  if(!AC||AC.state!=='running')return;
  const fever=G&&G.fever>0&&!G.demo;const spb=60/(fever?168:116)/2;
  if(musT<AC.currentTime-.2)musT=AC.currentTime+.05;
  while(musT<AC.currentTime+.12){const t=musT-AC.currentTime;const b=BASS[step];
    if(b)tone('triangle',b*(fever?2:1),null,.17,.5,t,musG);
    if(step%2===1)noise(.03,.12,'highpass',7000,null,t,1,musG);
    if(MEL[step])tone('sine',MEL[step],null,.12,.16,t,musG);
    if(fever)tone('square',[523,659,784,1047][step%4]*(step%8<4?1:1.122),null,.07,.07,t,musG);
    musT+=spb;step=(step+1)%32}
}

const OC={};
function objKey(o){return o.m+'|'+o.c+'|'+(o.pic||'')}
function objData(o){const k=objKey(o);if(OC[k])return OC[k];
  const d=OD[o.m](o.c,o);
  const parts=d.parts.map(pt=>{const s=sculpt(pt);colorize(s,null,pt.paint);return{s,geo:s.geo,mat:pt.mat||'v',def:pt}});
  let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9,y1=0;
  for(const p of parts){const bb=p.geo.boundingBox;x0=Math.min(x0,bb.min.x);x1=Math.max(x1,bb.max.x);z0=Math.min(z0,bb.min.z);z1=Math.max(z1,bb.max.z);y1=Math.max(y1,bb.max.y)}
  return OC[k]={d,parts,hh:y1,r:Math.min(.3,Math.max(-x0,x1,-z0,z1)*.85),pieces:null};
}
function buildPieces(od){
  if(od.pieces)return;
  const main=od.parts.find(p=>p.mat==='v');
  if(od.d.noCut||od.d.liquid||!main){od.pieces=[];return}
  const def=main.def,h=od.hh*.5,n=new V3(.55+Math.random()*.2,.8,.35).normalize();
  const pf=(x,y,z)=>x*n.x+(y-h)*n.y+z*n.z+.011*Math.sin(x*53+z*31)*Math.sin(y*47+x*13);
  const base=rgb(def.prims[0].col||'#ffffff'),inner=od.d.inner?rgb(od.d.inner):mixc(base,rgb('#fff6ea'),.55),res=def.res*1.2;
  od.pieces=[1,-1].map(sg=>{const prims=def.prims.concat([S.fn((x,y,z)=>-sg*pf(x,y,z)).sub().k(.003)]);
    const s=sculpt({prims,b:def.b,res});
    colorize(s,null,(x,y,z,c,p,a,b,cc)=>{if(Math.abs(pf(x,y,z))<res*1.3){if(od.d.seeds&&hashR(x,y,z,40)>.9)return rgb('#1b1b1b');return inner}return def.paint?def.paint(x,y,z,c,p,a,b,cc):c});
    return s.geo});
}
const JOBQ=[];
function queueRoomModels(){JOBQ.length=0;for(const o of room().objs){JOBQ.push(()=>objData(o),()=>buildPieces(objData(o)))}}
function instObj(o){const od=objData(o);const piv=G3(),inner=G3();inner.position.y=-od.hh/2;piv.add(inner);let main=null;
  for(const p of od.parts){let m;
    if(p.mat==='glass'){m=new THREE.Mesh(p.geo,GLASS);m.renderOrder=3;m.castShadow=false}
    else if(p.mat==='water'){m=new THREE.Mesh(p.geo,WATER);m.renderOrder=2;m.castShadow=false}
    else{m=vmesh(p.geo,.0065,o.golden?GOLD:VCM);if(!main)main=m}
    m.receiveShadow=true;inner.add(m)}
  if(od.d.deco)od.d.deco(inner);
  scene.add(piv);return{piv,hh:od.hh,r:od.r,od,main};
}

  if(G.fever>0&&!G.demo){const p=scr(2.45,2.35,-2.2);const kk=G.fever/(6+save.up.pipi*1.2);const w=70*k;
    c2.fillStyle='rgba(36,18,47,.7)';rr(p.x-w/2,p.y,w,10*k,5*k);c2.fill();c2.fillStyle='#5ef2c2';rr(p.x-w/2,p.y,w*kk,10*k,5*k);c2.fill()}
  for(const p of POP){const q=scr(p.x,p.y,p.z);const r=p.life/p.max;const a=Math.min(1,r*3);const s=p.size*k*(r>.85?1+(r-.85)*3:1);
    c2.save();c2.globalAlpha=a;c2.translate(clamp(q.x,70*k,W-70*k),q.y-p.dy);c2.rotate(p.rot);outlined(p.txt,0,0,s,p.c);c2.restore()}
  if(G.state==='play')drawTuto(k);
  if(!G.demo&&G.state==='play'){
    let col=null,a=0;const st=O.st;
    if(['looking','angry','glance','flash','rise','walk','inspect'].includes(st)){col='255,40,80';a=.45}
    else if(st==='suspicious'||st==='glancePre'){col='255,200,40';a=.25+.15*Math.sin(T*30)}
    if(G.flash){a=Math.max(a,.6*G.flash);col=col||'255,40,80'}
    if(col&&G.fever<=0){const g=c2.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);
      g.addColorStop(0,`rgba(${col},0)`);g.addColorStop(1,`rgba(${col},${a})`);c2.fillStyle=g;c2.fillRect(0,0,W,H)}
    if(G.fever>0){c2.fillStyle=`hsla(${(T*240)%360},90%,60%,${.08+G.fevFlash*.3})`;c2.fillRect(0,0,W,H)}
  }
  if(G.white>0){c2.fillStyle=`rgba(255,255,255,${G.white*.85})`;c2.fillRect(0,0,W,H)}
}
function drawTuto(k){
  if(G.tutoStep>=3)return;
  let txt=null,col='#ffffff';
  if(O.st==='suspicious'||O.st==='looking'){txt=holding?'✋ LÂCHE ! IL REGARDE !':'👀 Ne bouge plus…';col=holding?'#ff4d6d':'#ffd23f'}
  else if(!holding&&G.obj&&!G.obj.falling)txt=G.tutoStep===0?"👆 MAINTIENS l'écran pour pousser":'👆 Maintiens… pousse-le dans le vide !';
  if(!txt)return;
  const s=Math.min(22*k,W/18),sc=1+Math.sin(T*6)*.04;
  c2.save();c2.translate(W/2,H*.86);c2.scale(sc,sc);outlined(txt,0,0,s,col);c2.restore();
}

/* =================== HUD =================== */
const hud={lives:$('#lives'),score:$('#score'),best:$('#best'),chaos:$('#chaosFill'),combo:$('#combo'),par:$('#parFill'),pm:$('#parMult')};
let lastCombo=0;
function updHUD(){
  if(!G||G.demo)return;
  hud.lives.textContent='❤️'.repeat(Math.max(0,G.lives))+'🖤'.repeat(Math.max(0,G.maxLives-G.lives));
  hud.score.textContent=fmt(G.score);
  hud.best.textContent=G.score>G.bestBefore&&G.bestBefore>0?'🏆 NOUVEAU RECORD':'Record '+fmt(Math.max(save.best,G.score));
  hud.chaos.style.width=(G.fever>0?100:G.chaos*100)+'%';hud.chaos.classList.toggle('fever',G.fever>0);
  if(G.combo>1){hud.combo.textContent='COMBO x'+G.combo;hud.combo.classList.add('on');
    if(G.combo!==lastCombo){hud.combo.classList.remove('bump');void hud.combo.offsetWidth;hud.combo.classList.add('bump')}}
  else hud.combo.classList.remove('on');
  lastCombo=G.combo;
}
function updParHUD(){if(!G||G.demo)return;hud.par.style.width=(O.par*100).toFixed(1)+'%';hud.pm.textContent='x'+parMult().toFixed(1)}

/* =================== ÉCRANS =================== */
const menuEl=$('#menu'),hudEl=$('#hud'),root=$('#sheetRoot');
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2200)}
function closeSheet(){root.innerHTML=''}
function openSheet(html,onBind,center){
  root.innerHTML=`<div class="dim${center?' center':''}">${html}</div>`;
  const dim=root.firstElementChild;
  dim.addEventListener('pointerdown',e=>{if(e.target===dim&&!center){sfx('click');closeSheet();renderMenu()}});
  onBind&&onBind(dim);
}
function renderMenu(){
  ensureDay();
  $('#mCoins').textContent=fmt(save.coins);
  $('#giftBadge').hidden=save.daily.last===dayKey();
  $('#sndBtn').classList.toggle('off',!save.sound);$('#musBtn').classList.toggle('off',!save.music);
  const n=misReady();$('#misBadge').hidden=!n;$('#misBadge').textContent=n;
  const R=room(),idx=save.room,next=ROOMS[idx+1];
  $('#roomName').textContent=R.n;
  $('#roomSub').textContent=next?(save.total>=next.need?"▶ Une nouvelle pièce t'attend":`🔒 Prochaine pièce : ${fmt(next.need-save.total)} objets à casser`):'Tu as tout débloqué. Respect. 👑';
  $('#roomPrev').disabled=idx<=0;$('#roomNext').disabled=!(next&&save.total>=next.need);
  $('#mFoot').textContent=`Record : ${fmt(save.best)} · ${fmt(save.total)} objets cassés au total`;
}
let builtRoom=-1;
function showMenu(){
  closeSheet();introEl.hidden=true;if(builtRoom!==save.room){buildRoom();builtRoom=save.room}
  resetRun(true);hudEl.hidden=true;menuEl.hidden=false;renderMenu();
}
function startGame(){
  audioInit();closeSheet();
  if(builtRoom!==save.room){buildRoom();builtRoom=save.room}
  menuEl.hidden=true;hudEl.hidden=false;
  resetRun(false);holding=false;updHUD();updParHUD();
  sfx('meow');
}
function endGame(){
  G.state='over';holding=false;introEl.hidden=true;
  const s=G.score,isRec=s>save.best&&s>0;
  const earned=Math.floor(s/30)+G.breaks*2;
  const prevTotal=save.total;
  save.coins+=earned;if(isRec)save.best=s;save.total+=G.breaks;save.games++;
  ensureDay();save.today.breaks+=G.breaks;save.today.games++;
  misProgress('day',G.breaks);misProgress('games',1);misProgress('rare',G.rare);misProgress('dodge',G.dodges);
  misProgress('runBreaks',G.breaks);misProgress('score',s);misProgress('combo',G.maxCombo);misProgress('fever',G.fevers);misProgress('damage',G.damage);misProgress('clean',G.maxClean);
  save.tuto=true;
  const unlocked=ROOMS.filter(r=>r.need>prevTotal&&r.need<=save.total);
  if(unlocked.length)save.room=ROOMS.indexOf(unlocked[unlocked.length-1]);
  persist();
  const nextRoom=ROOMS.find(r=>r.need>save.total);
  let rank=RANKS[0][1];for(const r of RANKS)if(s>=r[0])rank=r[1];
  const verdict=G.damage>1e9?"L'assurance a fait faillite. Et la planète aussi.":G.damage>1e6?'Le musée porte plainte. Ton avocat est un poisson rouge.':G.damage>5000?"L'humain doit vendre un rein pour réparer ça.":G.damage>800?"Facture salée. L'humain pleure doucement.":G.damage>0?"Petits dégâts. L'humain te pardonnera… peut-être.":'Rien de cassé. Tu es malade ?';
  const ready=misReady();
  hudEl.hidden=true;
  sfx(isRec?'record':'over');
  openSheet(`<div class="card">
    <p style="font-weight:800;color:var(--tang);letter-spacing:1px">${pick(OVER_TITLES)}</p>
    <div class="over-score" id="ovScore">0</div>
    ${isRec?'<div><span class="record">🏆 NOUVEAU RECORD !</span></div>':`<p>Record : ${fmt(save.best)}</p>`}
    <div class="rank">${rank}</div>
    <div class="report"><h3>Rapport de dégâts</h3>
      <div class="r"><span>Objets cassés</span><b>${G.breaks}</b></div>
      <div class="r"><span>Facture</span><b>${fmt(G.damage)} €</b></div>
      <div class="r"><span>Meilleur combo</span><b>x${G.maxCombo}</b></div>
      <div class="r"><span>Pièges esquivés</span><b>${G.dodges}</b></div>
      <div class="r"><span>Frénésies</span><b>${G.fevers}</b></div>
      <div class="verdict">${verdict}</div>
    </div>
    <div class="earn">+${fmt(earned)} 🐟</div>
    ${unlocked.map(r=>`<div class="unlock">🔓 Nouvelle pièce : ${r.n} !</div>`).join('')}
    ${ready?`<div class="unlock" style="background:linear-gradient(90deg,#2aa883,#5ef2c2);color:#08392b">📋 ${ready} mission${ready>1?'s':''} à réclamer !</div>`:''}
    ${nextRoom&&!unlocked.length?`<div class="goal">Encore ${fmt(nextRoom.need-save.total)} objets pour débloquer ${nextRoom.n} 🔒</div>`:''}
    <div class="btns"><button class="big-btn" id="again">REJOUER</button><button class="ghost" id="toMenu">Menu</button></div>
  </div>`,dim=>{
    dim.querySelector('#again').onclick=()=>{sfx('click');startGame()};
    dim.querySelector('#toMenu').onclick=()=>{sfx('click');showMenu()};
    const el=dim.querySelector('#ovScore');const t0=performance.now();
    (function cnt(){const kk=Math.min(1,(performance.now()-t0)/900);el.textContent=fmt(s*(1-Math.pow(1-kk,3)));if(kk<1)requestAnimationFrame(cnt)})();
    if(isRec)for(let i=0;i<40;i++)part(cubeG,M(pick(['#ffd23f','#ff4d6d','#5ef2c2','#6fa8ff','#ff8a3d'])),rand(-2.5,2),rand(3,4.5),rand(-1,1),.06,[rand(-.5,.5),0,rand(-.3,.3)],4,{g:1.2,sy:.15,stick:true});
  },true);
}

/* ----- Boutique ----- */
let shopTab='up';
let TR=null,TS=null,TC=null;const THUMB={};
function catThumb(sk,ht){
  const key=sk.id+'|'+ht.id;if(THUMB[key]!==undefined)return THUMB[key];
  try{
    if(!TR){TR=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});TR.setPixelRatio(1);TR.setSize(228,192,false);
      TS=new THREE.Scene();TS.add(new THREE.HemisphereLight(0xffffff,0x886655,.75));TS.add(new THREE.AmbientLight(0xffffff,.2));
      const d=new THREE.DirectionalLight(0xffffff,.6);d.position.set(2,3,4);TS.add(d);
      TC=new THREE.PerspectiveCamera(30,228/192,.1,20);TC.position.set(.6,1.0,2.8);TC.lookAt(.05,.47,0)}
    const P=makeCat(sk,ht);P.g.rotation.y=-.55;poseCat(P,0,0,0,false,1,1.3,-.5,0);
    TS.add(P.g);TR.render(TS,TC);THUMB[key]=TR.domElement.toDataURL();TS.remove(P.g);disposeTree(P.g);
  }catch(e){THUMB[key]=''}
  return THUMB[key];
}
function openShop(){
  const tabs=`<div class="tabs"><button class="tab ${shopTab==='up'?'on':''}" data-t="up">Pouvoirs</button><button class="tab ${shopTab==='skin'?'on':''}" data-t="skin">Chats</button><button class="tab ${shopTab==='hat'?'on':''}" data-t="hat">Chapeaux</button></div>`;
  let body='';
  if(shopTab==='up'){
    body=UPG.map(u=>{const l=save.up[u.id],maxed=l>=u.max,c=u.cost[l];
      return `<div class="item"><div class="em">${u.e}</div><div class="tx"><div class="nm">${u.n}</div><div class="ds">${u.d}</div>
      <div class="lv">${Array.from({length:u.max},(_,i)=>`<i class="${i<l?'f':''}"></i>`).join('')}</div></div>
      <button class="buy" data-up="${u.id}" ${maxed||save.coins<c?'disabled':''}>${maxed?'MAX':'🐟 '+fmt(c)}</button></div>`}).join('');
  }else{
    const isSkin=shopTab==='skin',list=isSkin?SKINS:HATS,owned=isSkin?save.skins:save.hats,cur=isSkin?save.skin:save.hat;
    body='<div class="grid">'+list.map(it=>{const own=owned.includes(it.id),eq=cur===it.id;
      const img=catThumb(isSkin?it:skin(),isSkin?hat():it);
      return `<div class="tile ${eq?'eq':''}">${img?`<img src="${img}" alt="${it.n}">`:`<div style="font-size:40px">${it.e||'🐱'}</div>`}<div class="nm">${it.n}</div>
      <button class="buy ${own?'eqb':''}" data-it="${it.id}" ${(!own&&save.coins<it.cost)||eq?'disabled':''}>${eq?'Équipé':own?'Équiper':'🐟 '+fmt(it.cost)}</button></div>`}).join('')+'</div>';
  }
  const prev=root.querySelector('.list');const scroll=prev?prev.scrollTop:0;
  openSheet(`<div class="sheet"><div class="sheet-head"><h2>Boutique</h2><div class="pill"><span class="ic">🐟</span>${fmt(save.coins)}</div><button class="close" id="x" aria-label="Fermer">✕</button></div>${tabs}<div class="list">${body}</div></div>`,dim=>{
    dim.querySelector('.list').scrollTop=scroll;
    dim.querySelector('#x').onclick=()=>{sfx('click');closeSheet();renderMenu()};
    dim.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{sfx('click');shopTab=b.dataset.t;root.innerHTML='';openShop()});
    dim.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const u=UPG.find(x=>x.id===b.dataset.up),l=save.up[u.id],c=u.cost[l];
      if(l<u.max&&save.coins>=c){save.coins-=c;save.up[u.id]++;persist();sfx('buy');vib(30);toast(`${u.e} ${u.n} niveau ${save.up[u.id]} !`);openShop()}});
    dim.querySelectorAll('[data-it]').forEach(b=>b.onclick=()=>{
      const isSkin=shopTab==='skin',list=isSkin?SKINS:HATS,owned=isSkin?save.skins:save.hats;const it=list.find(x=>x.id===b.dataset.it);
      if(!owned.includes(it.id)){if(save.coins<it.cost)return;save.coins-=it.cost;owned.push(it.id);sfx('buy');vib(30);toast(isSkin?`Nouveau chat : ${it.n} !`:`Nouveau chapeau : ${it.n} !`)}else sfx('click');
      if(isSkin)save.skin=it.id;else save.hat=it.id;persist();ensureCat();openShop()});
  });
}

/* ----- Missions ----- */
function openMissions(){
  ensureDay();
  const ms=Math.max(0,new Date(new Date().setHours(24,0,0,0))-Date.now());
  const hh=Math.floor(ms/3.6e6),mm=Math.floor(ms%3.6e6/6e4);
  const body=save.mis.list.map((m,i)=>{const kk=Math.min(1,m.prog/m.goal),done=kk>=1;
    return `<div class="mis"><div class="top"><div class="nm">${misText(m)}</div><div class="rw">+${m.rw} 🐟</div></div>
    <div class="bar"><i style="width:${kk*100}%"></i></div>
    <div class="st"><span>${fmt(Math.min(m.prog,m.goal))} / ${fmt(m.goal)}</span>${m.claimed?'<span>✅ Réclamée</span>':done?`<button class="buy" data-claim="${i}">Réclamer</button>`:''}</div></div>`}).join('');
  openSheet(`<div class="sheet"><div class="sheet-head"><h2>Missions du jour</h2><button class="close" id="x" aria-label="Fermer">✕</button></div>
    <div class="list">${body}<div class="note">Nouvelles missions dans ${hh} h ${String(mm).padStart(2,'0')}</div></div></div>`,dim=>{
    dim.querySelector('#x').onclick=()=>{sfx('click');closeSheet();renderMenu()};
    dim.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{const m=save.mis.list[+b.dataset.claim];if(m.claimed||m.prog<m.goal)return;
      m.claimed=true;save.coins+=m.rw;persist();sfx('chest');vib(40);toast(`+${m.rw} 🐟 !`);openMissions()});
  });
}

/* ----- Cadeau du jour ----- */
function giftInfo(){
  const t=dayKey(),y=dayKey(-1);
  const streak=save.daily.last===y?save.daily.streak+1:(save.daily.last===t?save.daily.streak:1);
  const day=((streak-1)%7)+1;
  return{streak,day,reward:day===7?400:40+day*20};
}
function openGift(){
  const ready=save.daily.last!==dayKey();const g=giftInfo();
  const days=Array.from({length:7},(_,i)=>{const d=i+1;const cls=d<g.day||(!ready&&d===g.day)?'d':(d===g.day&&ready?'t':'');return `<b class="${cls}">${d===7?'🎁':'J'+d}</b>`}).join('');
  openSheet(`<div class="card">
    <h2>${ready?'Cadeau du jour !':'Reviens demain !'}</h2>
    <div><span class="chest ${ready?'shake':''}" id="chest">${ready?'🎁':'📦'}</span></div>
    <div class="streak">${days}</div>
    <p>${ready?`Série de ${g.streak} jour${g.streak>1?'s':''}. Le 7e jour, gros cadeau.`:`Série en cours : ${save.daily.streak} jour${save.daily.streak>1?'s':''}. Ne la casse pas… casse plutôt des vases.`}</p>
    <div class="btns">${ready?'<button class="big-btn" id="claim">OUVRIR</button>':''}<button class="ghost" id="x">${ready?'Plus tard':'OK'}</button></div>
  </div>`,dim=>{
    dim.querySelector('#x').onclick=()=>{sfx('click');closeSheet();renderMenu()};
    const c=dim.querySelector('#claim');
    if(c)c.onclick=()=>{audioInit();c.disabled=true;const ch=dim.querySelector('#chest');ch.classList.remove('shake');ch.textContent='✨';sfx('chest');vib([30,30,60]);
      save.daily={last:dayKey(),streak:g.streak};save.coins+=g.reward;persist();
      c.outerHTML=`<div class="reward">+${g.reward} 🐟</div>`;dim.querySelector('#x').textContent='Super !';renderMenu()};
  },true);
}

/* ----- Pause ----- */
let paused=false;
function pause(){
  if(!G||G.state!=='play'||paused||G.over)return;paused=true;holding=false;
  openSheet(`<div class="card"><h2>Pause</h2><p>L'humain n'a rien vu. Pour l'instant.</p>
  <div class="btns"><button class="big-btn" id="res">REPRENDRE</button><button class="ghost" id="quit">Abandonner</button></div></div>`,dim=>{
    dim.querySelector('#res').onclick=()=>{sfx('click');paused=false;closeSheet();last=performance.now()};
    dim.querySelector('#quit').onclick=()=>{sfx('click');paused=false;closeSheet();G.lives=0;endGame()};
  },true);
}

/* =================== ENTRÉES =================== */
function down(e){
  if(!G||G.state!=='play'||paused||root.firstChild)return;
  if(e.target.closest&&e.target.closest('button'))return;
  audioInit();holding=true;
}
function up(){holding=false}
window.addEventListener('pointerdown',down,{passive:true});
window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
window.addEventListener('blur',()=>{holding=false;pause()});
window.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&G&&G.state==='play'&&!paused&&!root.firstChild){audioInit();holding=true;e.preventDefault()}if(e.code==='Escape')pause()});
window.addEventListener('keyup',e=>{if(e.code==='Space')holding=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden){holding=false;pause();AC&&AC.suspend()}else AC&&AC.resume()});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());

$('#playBtn').onclick=()=>{sfx('click');startGame()};
$('#shopBtn').onclick=()=>{audioInit();sfx('click');openShop()};
$('#misBtn').onclick=()=>{audioInit();sfx('click');openMissions()};
$('#giftBtn').onclick=()=>{audioInit();sfx('click');openGift()};
$('#pauseBtn').onclick=()=>{sfx('click');pause()};
$('#sndBtn').onclick=()=>{audioInit();save.sound=!save.sound;persist();applyVol();sfx('click');renderMenu()};
$('#musBtn').onclick=()=>{audioInit();save.music=!save.music;persist();applyVol();sfx('click');renderMenu()};
$('#roomPrev').onclick=()=>{if(save.room>0){save.room--;persist();sfx('click');showMenu()}};
$('#roomNext').onclick=()=>{const n=ROOMS[save.room+1];if(n&&save.total>=n.need){save.room++;persist();sfx('click');showMenu()}};

/* =================== DÉMARRAGE =================== */
let last=performance.now(),hudT=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused)update(dt);
  hudT-=dt;if(hudT<=0){hudT=.1;updParHUD()}
  updateCam(dt);
  renderer.render(scene,camera);
  drawOverlay();
  requestAnimationFrame(frame);
}
window.addEventListener('resize',resize);
window.__minou={cat:()=>cat,perf:()=>{const t0=performance.now();for(let i=0;i<60;i++)update(1/60);return(performance.now()-t0)/60},act:a=>nextAction(a),cam:v=>{CAMO=v},spawn:i=>{if(G.obj)scene.remove(G.obj.piv);const d=room().objs[i];const o={...d,x:0,sx:0,y:TT,falling:false,pop:1};Object.assign(o,instObj(o));o.piv.position.set(-.2,TT+o.hh/2,0);G.obj=o;return o.hh},stats:()=>({cat:CATS&&CATS.geo.attributes.position.count,human:HUMS&&HUMS.geo.attributes.position.count}),G:()=>G,O:()=>O,save};
function boot(){
  const t0=performance.now();
  resize();catSculpt();humanSculpt();sofaSculpt();tableSculpt();phoneSculpt();buildOwner();showMenu();camK=1;
  window.__minou.bootMs=Math.round(performance.now()-t0);
  $('#loading').remove();
  requestAnimationFrame(frame);
  if(save.daily.last!==dayKey())setTimeout(()=>{if(G.state!=='play'&&!root.firstChild)openGift()},700);
}
setTimeout(boot,30);
})();
</script>
