<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Minou Chaos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#24122f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minou Chaos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout : une scène WebGL plein écran, un calque 2D pour les textes flottants, et des calques HTML (menus, HUD) par-dessus. */
:root{
  --night:#24122f;      /* fond des panneaux */
  --plum:#3b1f4f;       /* surface */
  --plum-2:#4e2a66;     /* surface haute */
  --cream:#fff4e3;      /* texte */
  --muted:#cdb6d9;      /* texte secondaire */
  --tang:#ff8a3d;       /* accent : bouton jouer, chat roux */
  --tang-d:#d9601b;
  --mint:#5ef2c2;       /* succès */
  --gold:#ffd23f;       /* monnaie, record */
  --danger:#ff4d6d;     /* grillé */
  --f-display:"Lilita One","Baloo 2",system-ui,sans-serif;
  --f-body:"Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--cream);font-family:var(--f-body);
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#cv,#ov{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{pointer-events:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}

.layer{position:fixed;inset:0;display:flex;flex-direction:column;pointer-events:none;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.layer>*{pointer-events:auto}
.wrap{width:100%;max-width:480px;margin:0 auto}

/* ---------- MENU ---------- */
#menu{justify-content:space-between}
.topbar{display:flex;align-items:center;gap:8px;padding-block:10px}
.pill{display:flex;align-items:center;gap:6px;background:rgba(36,18,47,.82);border:2px solid rgba(255,255,255,.12);
  border-radius:999px;padding:4px 12px 4px 8px;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;backdrop-filter:blur(6px)}
.pill .ic{font-size:20px}
.spacer{flex:1}
.icon-btn{width:44px;height:44px;border-radius:14px;background:rgba(36,18,47,.82);border:2px solid rgba(255,255,255,.12);
  font-size:20px;display:grid;place-items:center;position:relative;backdrop-filter:blur(6px)}
.icon-btn.off{opacity:.45}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--danger);
  color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}

.title{text-align:center;margin-top:2px}
.logo{font-family:var(--f-display);font-weight:400;font-size:clamp(46px,14vw,64px);line-height:.9;letter-spacing:1px;margin:0;
  color:var(--cream);text-shadow:0 4px 0 var(--tang-d),0 8px 0 rgba(0,0,0,.25)}
.logo span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.logo .b{color:var(--tang);text-shadow:0 4px 0 #8a2f00,0 8px 0 rgba(0,0,0,.25)}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.tagline{display:inline-block;font-weight:700;font-size:15px;color:var(--cream);margin:8px 0 0;padding:2px 14px;
  background:rgba(36,18,47,.78);border-radius:999px}

.bottom{display:flex;flex-direction:column;gap:10px;padding-block:10px 14px}
.room-card{display:flex;align-items:center;gap:8px;background:rgba(36,18,47,.88);border:2px solid rgba(255,255,255,.12);
  border-radius:20px;padding:8px;backdrop-filter:blur(6px)}
.room-card .arrow{width:42px;height:42px;border-radius:12px;background:var(--plum-2);font-size:20px;font-weight:800}
.room-card .arrow:disabled{opacity:.3}
.room-info{flex:1;text-align:center;min-width:0}
.room-name{font-family:var(--f-display);font-size:22px;letter-spacing:.5px}
.room-sub{font-size:13px;color:var(--muted);font-weight:700;line-height:1.2}
.big-btn{width:100%;font-family:var(--f-display);font-size:34px;letter-spacing:1px;padding:12px 0 10px;border-radius:22px;
  background:var(--tang);color:#fff;text-shadow:0 3px 0 var(--tang-d);box-shadow:0 7px 0 var(--tang-d),0 12px 24px rgba(0,0,0,.35);
  transition:transform .08s}
.big-btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--tang-d)}
.big-btn:disabled{filter:grayscale(1);opacity:.6}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mid-btn{position:relative;font-weight:800;font-size:18px;padding:11px 0;border-radius:18px;background:var(--plum-2);
  box-shadow:0 5px 0 #2a1438;display:flex;align-items:center;justify-content:center;gap:8px}
.mid-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2a1438}
.foot{text-align:center;font-size:13px;color:var(--cream);font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.6)}

/* ---------- HUD ---------- */
#hud{pointer-events:none}
#hud>*{pointer-events:none}
.hud-top{display:flex;align-items:flex-start;gap:8px;padding-block:10px 0}
#lives{font-size:24px;letter-spacing:-2px;min-width:90px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.score-box{flex:1;text-align:center}
#score{font-family:var(--f-display);font-size:40px;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
#best{font-size:13px;font-weight:800;color:var(--cream);opacity:.9;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#pauseBtn{pointer-events:auto}
.chaos{display:flex;align-items:center;gap:8px;margin-top:6px}
.chaos-label{font-family:var(--f-display);font-size:15px;letter-spacing:1px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.chaos-bar{flex:1;height:14px;border-radius:8px;background:rgba(36,18,47,.75);border:2px solid rgba(255,255,255,.18);overflow:hidden}
#chaosFill{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--tang),var(--gold));transition:width .2s}
#chaosFill.fever{background:linear-gradient(90deg,#ff4d6d,#ffd23f,#5ef2c2,#6fa8ff,#c86bff);background-size:200% 100%;animation:rb .6s linear infinite}
@keyframes rb{to{background-position:200% 0}}
#combo{align-self:center;margin-top:8px;font-family:var(--f-display);font-size:26px;color:var(--gold);
  text-shadow:0 3px 0 #a05a00;opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s}
#combo.on{opacity:1;transform:scale(1)}
#combo.bump{animation:bump .25s}
@keyframes bump{40%{transform:scale(1.35) rotate(-4deg)}}

/* ---------- SHEETS & MODALS ---------- */
.dim{position:fixed;inset:0;background:rgba(15,6,22,.62);display:flex;align-items:flex-end;justify-content:center;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  animation:fade .18s}
.dim.center{align-items:center;padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:480px;max-height:86%;background:var(--plum);border-radius:26px 26px 0 0;
  display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .25s cubic-bezier(.2,1.3,.4,1);
  border:2px solid rgba(255,255,255,.1);border-bottom:0}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.sheet-head h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;flex:1;letter-spacing:.5px}
.close{width:40px;height:40px;border-radius:12px;background:var(--plum-2);font-size:18px;font-weight:800}
.tabs{display:flex;gap:6px;padding:0 16px 10px}
.tab{flex:1;padding:8px 0;border-radius:12px;background:var(--night);font-weight:800;font-size:15px;color:var(--muted)}
.tab.on{background:var(--tang);color:#fff}
.list{overflow-y:auto;padding:4px 16px 18px;display:flex;flex-direction:column;gap:10px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{background:var(--night);border-radius:18px;padding:12px;display:flex;align-items:center;gap:12px;border:2px solid transparent}
.item .em{font-size:32px;width:44px;text-align:center;flex:none}
.item .tx{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:17px;line-height:1.15}
.item .ds{font-size:13px;color:var(--muted);font-weight:600;line-height:1.25}
.lv{display:flex;gap:3px;margin-top:4px}
.lv i{width:14px;height:6px;border-radius:3px;background:rgba(255,255,255,.15)}
.lv i.f{background:var(--mint)}
.buy{flex:none;min-width:84px;padding:8px 10px;border-radius:12px;background:var(--gold);color:#3a2300;font-weight:800;font-size:15px;
  box-shadow:0 3px 0 #b88a00}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #b88a00}
.buy:disabled{background:var(--plum-2);color:var(--muted);box-shadow:none}
.buy.eqb{background:var(--mint);color:#08392b;box-shadow:0 3px 0 #2aa883}
.tile{background:var(--night);border-radius:18px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;
  border:2px solid transparent;text-align:center;min-width:0}
.tile.eq{border-color:var(--mint)}
.tile img{width:100%;max-width:110px;aspect-ratio:228/192;height:auto;display:block}
.tile .nm{font-weight:800;font-size:13px;line-height:1.1;min-height:28px;display:grid;place-items:center}
.tile .buy{min-width:0;width:100%;font-size:13px;padding:6px 4px}

.mis{background:var(--night);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mis .top{display:flex;gap:10px;align-items:center}
.mis .nm{flex:1;font-weight:800;font-size:16px;line-height:1.2}
.mis .rw{font-weight:800;color:var(--gold);white-space:nowrap}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--mint);border-radius:6px}
.mis .st{font-size:13px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.note{text-align:center;color:var(--muted);font-weight:700;font-size:14px}

.card{width:100%;max-width:400px;background:var(--plum);border-radius:28px;padding:16px;text-align:center;
  border:2px solid rgba(255,255,255,.1);animation:pop .35s cubic-bezier(.2,1.5,.4,1);display:flex;flex-direction:column;gap:9px;
  max-height:calc(100% - 20px);overflow-y:auto;touch-action:pan-y}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.card h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0;line-height:1.05;text-wrap:balance}
.card p{margin:0;font-weight:700;color:var(--muted);text-wrap:balance}
.chest{font-size:96px;line-height:1;display:inline-block}
.chest.shake{animation:shake .5s ease-in-out infinite}
@keyframes shake{20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
.streak{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.streak b{width:34px;height:34px;border-radius:10px;background:var(--night);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.streak b.d{background:var(--mint);color:#08392b}
.streak b.t{background:var(--gold);color:#3a2300;transform:scale(1.12)}
.reward{font-family:var(--f-display);font-size:40px;color:var(--gold);text-shadow:0 3px 0 #a05a00}

/* ---------- GAME OVER ---------- */
.over-score{font-family:var(--f-display);font-size:54px;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.record{display:inline-block;background:var(--gold);color:#3a2300;font-weight:800;border-radius:999px;padding:3px 14px;
  font-size:16px;animation:pulse .9s ease-in-out infinite}
.rank{font-family:var(--f-display);font-size:22px;color:var(--tang)}
.report{background:var(--night);border-radius:18px;padding:10px 14px;text-align:left}
.report h3{margin:0 0 6px;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.report .r{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:15px;padding:1px 0;border-bottom:1px dashed rgba(255,255,255,.1)}
.report .r b{font-variant-numeric:tabular-nums;white-space:nowrap}
.verdict{font-size:14px;color:var(--cream);font-weight:700;margin-top:8px;font-style:italic;opacity:.9}
.earn{font-family:var(--f-display);font-size:28px;color:var(--gold)}
.unlock{background:linear-gradient(90deg,var(--tang),#ff5f8f);color:#fff;border-radius:16px;padding:10px;font-weight:800}
.goal{font-size:14px;font-weight:700;color:var(--muted)}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.ghost{font-weight:800;font-size:17px;padding:10px 0;border-radius:16px;background:var(--plum-2)}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-30px);opacity:0;
  background:var(--mint);color:#08392b;font-weight:800;padding:10px 18px;border-radius:999px;z-index:50;pointer-events:none;
  transition:.25s;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:28px;background:var(--night);z-index:100;text-align:center;padding:0 24px}

@media (prefers-reduced-motion:reduce){
  .logo span,.pulse,.record,.chest.shake{animation:none}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="ov"></canvas>

<!-- MENU -->
<div id="menu" class="layer">
  <div class="wrap">
    <div class="topbar">
      <div class="pill"><span class="ic">🐟</span><span id="mCoins">0</span></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="giftBtn" aria-label="Cadeau du jour">🎁<span class="badge pulse" id="giftBadge">!</span></button>
      <button class="icon-btn" id="sndBtn" aria-label="Bruitages">🔊</button>
      <button class="icon-btn" id="musBtn" aria-label="Musique">🎵</button>
    </div>
    <div class="title">
      <h1 class="logo"><span>MINOU</span><br><span class="b" style="animation-delay:.3s">CHAOS</span></h1>
      <p class="tagline">Fais tout tomber. Ne te fais pas griller.</p>
    </div>
  </div>
  <div class="wrap bottom">
    <div class="room-card">
      <button class="arrow" id="roomPrev" aria-label="Pièce précédente">◀</button>
      <div class="room-info"><div class="room-name" id="roomName">Le Salon</div><div class="room-sub" id="roomSub"></div></div>
      <button class="arrow" id="roomNext" aria-label="Pièce suivante">▶</button>
    </div>
    <button class="big-btn" id="playBtn">JOUER</button>
    <div class="row">
      <button class="mid-btn" id="shopBtn">🛍️ Boutique</button>
      <button class="mid-btn" id="misBtn">📋 Missions<span class="badge" id="misBadge" hidden>!</span></button>
    </div>
    <div class="foot" id="mFoot"></div>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="layer" hidden>
  <div class="wrap">
    <div class="hud-top">
      <div id="lives"></div>
      <div class="score-box"><div id="score">0</div><div id="best">Record 0</div></div>
      <button class="icon-btn" id="pauseBtn" aria-label="Pause">⏸</button>
    </div>
    <div class="chaos"><div class="chaos-label">CHAOS</div><div class="chaos-bar"><div id="chaosFill"></div></div></div>
  </div>
  <div id="combo">x2</div>
</div>

<div id="sheetRoot"></div>
<div id="toast"></div>
<div id="loading">Le chat s'étire…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

const GOLD=M('#ffd23f',{emissive:0x553300});
function makeObjMesh(o){
  const [inner,hh]=MB[o.m](o.c,o);
  const piv=G3();inner.position.y=-hh/2;piv.add(inner);
  if(o.golden)inner.traverse(n=>{if(n.isMesh)n.material=GOLD});
  scene.add(piv);return{piv,hh};
}

/* =================== ÉTAT DU JEU =================== */
let G=null,cat=null,O=null,PT=[],DEB=[],WRECK=[],POP=[],shake=0,holding=false,T=0;
function skin(){return SKINS.find(s=>s.id===save.skin)||SKINS[0]}
function hat(){return HATS.find(h=>h.id===save.hat)||HATS[0]}
function room(){return ROOMS[save.room]||ROOMS[0]}

function clearMess(){
  for(const p of PT){scene.remove(p.m);if(p.own)p.m.material.dispose()}PT=[];
  for(const d of DEB)scene.remove(d);DEB=[];
  for(const w of WRECK){scene.remove(w);disposeTree(w)}WRECK=[];
  if(G&&G.obj){scene.remove(G.obj.piv);disposeTree(G.obj.piv)}
}
function resetRun(demo){
  clearMess();
  G={demo,state:demo?'menu':'play',score:0,lives:3+(demo?0:save.up.lives),maxLives:3+(demo?0:save.up.lives),combo:0,comboT:0,maxCombo:0,
     chaos:0,fever:0,fevers:0,breaks:0,damage:0,clean:0,maxClean:0,lock:0,obj:null,spawnT:0,t:0,over:false,overT:0,rare:0,
     tutoStep:demo||save.tuto?99:0,bestBefore:save.best,flash:0,fevFlash:0};
  cat={x:tableL+.3,push:0,hop:0,hopFrom:0,hopTo:0,innocent:0,blink:2};
  O={st:'distracted',t:demo?2:(save.tuto?2.4:4.5),turn:0,bubble:'',bt:0,feint:false,warn:.6,away:0,idleT:rand(3,6)};
  POP=[];ensureCat();spawnObj();
}
function diff(){return G.demo?.2:Math.min(1,G.breaks/55)}
function distractDur(){const d=diff();return rand(1.3,3.4)*(1-.45*d)+.2}
function warnDur(){const d=diff();return Math.max(.32,(.72-.3*d)+save.up.ears*.07)}

function pickObj(){
  const objs=room().objs;
  for(const o of objs){if(o.rare&&Math.random()<o.rare)return o}
  return pick(objs.filter(o=>!o.rare));
}
function spawnObj(){
  const def=pickObj();
  const sx=tableL+.95+rand(0,.22);
  const o={...def,x:sx,sx,y:TT,vx:0,vy:0,rx:0,rz:0,vrx:0,vrz:0,falling:false,pop:0,golden:!def.alarm&&!def.fish&&Math.random()<.06};
  Object.assign(o,makeObjMesh(o));o.piv.rotation.y=rand(-.4,.4);o.piv.scale.setScalar(.05);
  G.obj=o;
  cat.hopFrom=cat.x;cat.hopTo=sx-CAT_OFF;cat.hop=.32;
  if(!G.demo)sfx('pop');
}

/* =================== L'HUMAIN (IA) =================== */
function say(arr,dur=1.6){O.bubble=typeof arr==='string'?arr:pick(arr);O.bt=dur}
function ownerSet(st,t){O.st=st;O.t=t}
function startSuspicious(short){
  O.feint=!short&&Math.random()<(.16+.22*diff());
  O.warn=short?Math.min(.5,warnDur()):warnDur();
  ownerSet('suspicious',O.warn);if(!G.demo)sfx('hmm');
}
function ownerUpdate(dt){
  O.bt-=dt;
  if(G.fever>0){O.away=Math.min(1,O.away+dt*4);return}
  O.away=Math.max(0,O.away-dt*3);
  const tgt={distracted:0,suspicious:.45,looking:1,angry:1}[O.st];
  O.turn+=(tgt-O.turn)*Math.min(1,dt*(O.st==='suspicious'?7:14));
  O.t-=dt;
  if(O.st==='distracted'){
    O.idleT-=dt;if(O.idleT<=0&&O.bt<=0){if(!G.demo)say(LINES.idle,1.8);O.idleT=rand(4,8)}
    if(O.t<=0)startSuspicious(false);
  }else if(O.st==='suspicious'){
    if(O.t<=0){
      if(O.feint){ownerSet('distracted',rand(.4,1.2));if(Math.random()<.5)say(LINES.feint,1.1)}
      else{ownerSet('looking',rand(.9,1.7));if(!G.demo)sfx('look')}
    }
  }else if(O.st==='looking'){
    if(holding&&G.lock<=0&&!G.demo&&!G.over&&G.state==='play')caught();
    else if(O.t<=0){
      if(O.bt<=0&&!G.demo&&Math.random()<.4)say(LINES.innocent,1.3);
      ownerSet('distracted',Math.random()<.18+.15*diff()?rand(.35,.7):distractDur());
    }
  }else if(O.st==='angry'){
    if(O.t<=0)ownerSet('distracted',distractDur()+.5);
  }
}
function caught(){
  G.lives--;G.combo=0;G.comboT=0;G.clean=0;G.lock=1.3;cat.innocent=1.4;
  ownerSet('angry',1.3);say(LINES.angry,1.5);
  shake=1;G.flash=1;vib([90,50,140]);sfx('caught');
  addPop(cat.x+.3,TT+1.1,0,'GRILLÉ !','#ff4d6d',46,1.2);
  if(G.lives<=0){G.over=true;G.overT=1.7}
  updHUD();
}

/* =================== BOUCLE =================== */
function update(dt){
  T+=dt;G.t+=dt;
  if(G.demo)holding=O.st==='distracted'&&O.t>.25&&G.fever<=0;
  if(G.state==='play'||G.demo){
    ownerUpdate(dt);
    if(G.lock>0)G.lock-=dt;
    if(cat.innocent>0)cat.innocent-=dt;
    if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0){G.combo=0;updHUD()}}
    if(G.fever>0){G.fever-=dt;if(G.fever<=0)endFever()}
    if(G.over){G.overT-=dt;if(G.overT<=0){G.over=false;endGame()}}
    updateObj(dt);
  }
  cat.blink-=dt;if(cat.blink<-.12)cat.blink=rand(2,5);
  updateParticles(dt);
  for(let i=POP.length-1;i>=0;i--){const p=POP[i];p.life-=dt;p.dy+=p.vy*dt;p.vy*=.96;if(p.life<=0)POP.splice(i,1)}
  shake*=Math.pow(.02,dt);if(shake<.01)shake=0;
  G.flash=Math.max(0,G.flash-dt*2.5);G.fevFlash=Math.max(0,G.fevFlash-dt*2);
  const hopY=cat.hop>0?Math.sin((1-cat.hop/.32)*Math.PI)*.3:0;
  poseCat(catP,cat.x,TT+hopY,cat.push,cat.innocent>0,cat.blink,T);
  if(skin().rainbow){catP.bodyM.color.setHSL((T*.15)%1,.75,.66);catP.bellyM.color.setHSL((T*.15+.1)%1,.9,.88)}
  poseOwner(dt);
  if(G.fever>0&&!G.demo)hemi.color.setHSL((T*.8)%1,.8,.75);else hemi.color.set(0xffffff);
  const o=G.obj;
  if(edgeMark){const near=o&&!o.falling&&o.x>tableR-.35&&!G.demo;edgeMark.material.opacity=near?.5+.4*Math.sin(T*20):0}
}
function pushSpeed(o){return .78*(1+.1*save.up.paw)*(G.fever>0?2.3:1)/o.w*(1+diff()*.15)}
function updateObj(dt){
  if(cat.hop>0){cat.hop-=dt;const k=1-Math.max(0,cat.hop)/.32;cat.x=cat.hopFrom+(cat.hopTo-cat.hopFrom)*k}
  const o=G.obj;
  if(!o){G.spawnT-=dt;if(G.spawnT<=0&&!G.over)spawnObj();cat.push=Math.max(0,cat.push-dt*8);return}
  o.pop=Math.min(1,o.pop+dt*5);
  const sc=o.falling?1:Math.max(.05,easeBack(o.pop));
  o.piv.scale.set(sc,sc,sc);
  if(o.falling){
    o.vy-=13*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.rz+=o.vrz*dt;o.rx+=o.vrx*dt;cat.push=Math.max(0,cat.push-dt*6);
    o.piv.position.set(o.x,o.y+o.hh/2,0);o.piv.rotation.z=o.rz;o.piv.rotation.x=o.rx;
    if(o.y<=0)smash(o);
    return;
  }
  if(G.lock>0){o.x+=(o.sx-o.x)*Math.min(1,dt*6);cat.x=o.x-CAT_OFF;cat.push=0}
  else{
    const canPush=holding&&cat.hop<=0&&!G.over&&(G.state==='play'||G.demo);
    if(canPush){o.x+=pushSpeed(o)*dt;cat.push=Math.min(1,cat.push+dt*9);if(G.tutoStep===0)G.tutoStep=1}
    else cat.push=Math.max(0,cat.push-dt*9);
    if(cat.hop<=0)cat.x=o.x-CAT_OFF-(1-cat.push)*.05;
  }
  const wob=o.x>tableR-.12?Math.sin(T*38)*.12:0;
  o.piv.position.set(o.x,o.y+o.hh/2*sc,0);o.piv.rotation.z=wob;
  if(o.x>tableR){o.falling=true;o.vx=.35+pushSpeed(o)*.25;o.vy=.9;o.vrz=-rand(4,8);o.vrx=rand(-3,3);sfx('whoosh')}
}
function easeBack(k){const c=1.7;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)}
function smash(o){
  G.obj=null;G.spawnT=.38;
  const fev=G.fever>0;
  if(!G.demo){
    G.combo=G.comboT>0?G.combo+1:1;G.comboT=5.5;G.maxCombo=Math.max(G.maxCombo,G.combo);
    G.clean++;G.maxClean=Math.max(G.maxClean,G.clean);
    const mult=Math.min(G.combo,10)*(fev?2:1)*(o.golden?3:1);
    const pts=o.pts*mult;
    G.score+=pts;G.damage+=o.eur*(o.golden?3:1);G.breaks++;
    if(o.alarm||o.fish)G.rare++;
    if(!fev){G.chaos+=.13*(1+.18*save.up.chaos);if(G.chaos>=1)startFever()}
    addPop(o.x,.7,0,'+'+fmt(pts),o.golden?'#ffd23f':'#ffffff',34,1);
    if(G.combo>1){addPop(o.x-.1,1.15,0,'COMBO x'+G.combo,'#ffd23f',26,1);sfx('combo',G.combo)}
    if(o.golden)addPop(o.x,1.5,0,'✨ OBJET EN OR x3','#ffd23f',22,1.3);
    if(o.fish){addPop(o.x-.3,1.5,0,'Le poisson est libre ! +5 🐟','#7fd3ff',20,1.6);save.coins+=5}
    vib(o.w>1.4?45:25);
    if(!fev&&O.st==='distracted'){
      if(o.alarm){O.t=0;say(LINES.alarm,1.4);sfx('alarm');startSuspicious(true)}
      else if(Math.random()<.22+.3*diff()&&O.t>.6){O.t=rand(.15,.5);say(LINES.noise,1.2)}
    }
    if(G.tutoStep<3&&G.breaks>=3)G.tutoStep=3;
    if(G.tutoStep===1)G.tutoStep=2;
    misProgress('combo',G.combo,true);misProgress('runBreaks',G.breaks,true);misProgress('score',G.score,true);
    misProgress('damage',G.damage,true);misProgress('clean',G.clean,true);
    updHUD();
  }
  addPop(o.x+rand(-.2,.2),2.1,0,pick(QUIPS[o.fx]||QUIPS.shards),'#ffffff',30,.8,rand(-.25,.25));
  shake=Math.max(shake,.35+o.w*.25);
  sfx('crash',o.fx);
  burst(o);
  // l'épave reste par terre, couchée
  o.piv.scale.set(.85,.85,.85);o.piv.position.set(o.x,o.hh*.32,rand(-.15,.3));
  o.piv.rotation.set(rand(-.3,.3),rand(0,6.28),Math.PI/2*(Math.random()<.5?1:-1));
  WRECK.push(o.piv);if(WRECK.length>14){const w=WRECK.shift();scene.remove(w);disposeTree(w)}
}
function startFever(){
  G.chaos=1;G.fever=6+save.up.pipi*1.2;G.fevers++;G.fevFlash=1;
  poof(ownerX,1.2,ownerZ+.3);
  addPop(-.4,2.6,0,'FRÉNÉSIE !!','#ffd23f',58,1.5);
  addPop(-.4,2.2,0,"L'humain est aux toilettes 🚽",'#ffffff',22,1.8);
  sfx('fever');sfx('flush');vib([40,30,40,30,80]);
  if(!G.demo)misProgress('fever',G.fevers,true);
  O.bubble='';
}
function endFever(){
  G.fever=0;G.chaos=0;ownerSet('distracted',1.8);O.turn=0;say(LINES.back,1.8);poof(ownerX,1.2,ownerZ+.3);updHUD();
}
function addPop(x,y,z,txt,c,size,life,rot=0){POP.push({x,y,z,dy:0,txt,c,size,life,max:life,vy:60,rot})}

/* =================== PARTICULES 3D =================== */
const tetraG=new THREE.TetrahedronGeometry(1),cubeG=new THREE.BoxGeometry(1,1,1),ballG=new THREE.SphereGeometry(1,8,6),discG=new THREE.CircleGeometry(1,20);
function part(geo,mat,x,y,z,s,v,life,opt){
  const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.scale.setScalar(s);m.castShadow=!!(opt&&opt.shadow);scene.add(m);
  const p=Object.assign({m,vx:v[0],vy:v[1],vz:v[2],life,max:life,s,spx:rand(-12,12),spy:rand(-12,12),spz:rand(-12,12),g:13,floor:true,stick:false,own:false,grow:0},opt);PT.push(p);return p;
}
function poof(x,y,z){for(let i=0;i<14;i++){const m=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.9,depthWrite:false});
  part(ballG,m,x+rand(-.4,.4),y+rand(-.6,.6),z+rand(-.3,.3),rand(.12,.22),[rand(-.8,.8),rand(.2,1),rand(-.5,.5)],rand(.4,.7),{own:true,g:0,floor:false,grow:1.5})}}
function splat(x,z,c,r){if(DEB.length>200)return;const m=new THREE.Mesh(discG,M(c));m.rotation.x=-Math.PI/2;m.position.set(x,.004+DEB.length*.00002,z);m.scale.set(r,r*rand(.6,1),1);m.receiveShadow=true;scene.add(m);DEB.push(m)}
function burst(o){

function updateParticles(dt){
  for(let i=PT.length-1;i>=0;i--){const p=PT[i],m=p.m;p.life-=dt;
    if(p.life<=0){scene.remove(m);if(p.own)m.material.dispose();PT.splice(i,1);continue}
    p.vy-=p.g*dt;m.position.x+=p.vx*dt;m.position.y+=p.vy*dt;m.position.z+=p.vz*dt;
    if(!p.sprite){m.rotation.x+=p.spx*dt;m.rotation.y+=p.spy*dt;m.rotation.z+=p.spz*dt}
    if(p.grow){m.scale.setScalar(p.s*(1+(1-p.life/p.max)*p.grow));m.material.opacity=.85*(p.life/p.max)}
    if(p.sy)m.scale.y=p.s*p.sy;
    if(p.flop)m.material.rotation=Math.sin(T*25)*.5;
    const fy=p.s*.4;
    if(p.floor&&m.position.y<fy){m.position.y=fy;p.vy=p.flop?rand(1.5,3):-p.vy*.3;p.vx*=.6;p.vz*=.6;p.spx*=.4;p.spy*=.4;p.spz*=.4;
      if(p.stick&&Math.abs(p.vy)<.6){
        if(p.blob){splat(m.position.x,m.position.z,'#'+m.material.color.getHexString(),p.s*2.4);scene.remove(m)}
        else{m.rotation.x=rand(-.3,.3);m.rotation.z=rand(-.3,.3);DEB.push(m);if(DEB.length>220){const d=DEB.shift();scene.remove(d)}}
        PT.splice(i,1)}}
  }
}

let camK=1,W=400,H=700,UIK=1,DPR=1;
const camT=new V3(),camDir=new V3(.3,.5,1).normalize(),_v=new V3();
function resize(){
  W=innerWidth;H=innerHeight;DPR=Math.min(window.devicePixelRatio||1,2);
  renderer.setPixelRatio(DPR);renderer.setSize(W,H,false);
  ov.width=Math.round(W*DPR);ov.height=Math.round(H*DPR);
  camera.aspect=W/H;camera.updateProjectionMatrix();
  UIK=clamp(Math.min(W/400,H/680),.75,1.4);
}
function updateCam(dt){
  camK+=((G.state==='play'?0:1)-camK)*Math.min(1,dt*3);
  const vf=camera.fov*Math.PI/180,hf=2*Math.atan(Math.tan(vf/2)*camera.aspect);
  const needW=portraitW(),needH=3.3;
  const dist=Math.max(needW/2/Math.tan(hf/2),needH/2/Math.tan(vf/2))*(1+camK*.06);
  const portrait=camera.aspect<1;
  camT.set(-.38,1.0+(portrait?.12:0)-camK*(portrait?.85:.35),-.35);
  camera.position.copy(camT).addScaledVector(camDir,dist);
  if(shake){camera.position.x+=rand(-1,1)*shake*.06;camera.position.y+=rand(-1,1)*shake*.06}
  camera.lookAt(camT);
}
function portraitW(){return G&&G.state==='play'?4.35:4.7}
function scr(x,y,z){_v.set(x,y,z).project(camera);return{x:(_v.x+1)/2*W,y:(1-_v.y)/2*H}}

    c2.fillStyle='rgba(36,18,47,.7)';rr(p.x-w/2,p.y,w,10*k,5*k);c2.fill();c2.fillStyle='#5ef2c2';rr(p.x-w/2,p.y,w*kk,10*k,5*k);c2.fill()}
  for(const p of POP){const q=scr(p.x,p.y,p.z);const r=p.life/p.max;const a=Math.min(1,r*3);const s=p.size*k*(r>.85?1+(r-.85)*3:1);

  const body=save.mis.list.map((m,i)=>{const kk=Math.min(1,m.prog/m.goal),done=kk>=1;
    return `<div class="mis"><div class="top"><div class="nm">${misText(m)}</div><div class="rw">+${m.rw} 🐟</div></div>
    <div class="bar"><i style="width:${kk*100}%"></i></div>
    <div class="st"><span>${fmt(Math.min(m.prog,m.goal))} / ${fmt(m.goal)}</span>${m.claimed?'<span>✅ Réclamée</span>':done?`<button class="buy" data-claim="${i}">Réclamer</button>`:''}</div></div>`}).join('');
  openSheet(`<div class="sheet"><div class="sheet-head"><h2>Missions du jour</h2><button class="close" id="x" aria-label="Fermer">✕</button></div>
    <div class="list">${body}<div class="note">Nouvelles missions dans ${hh} h ${String(mm).padStart(2,'0')}</div></div></div>`,dim=>{
    dim.querySelector('#x').onclick=()=>{sfx('click');closeSheet();renderMenu()};
    dim.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{const m=save.mis.list[+b.dataset.claim];if(m.claimed||m.prog<m.goal)return;
      m.claimed=true;save.coins+=m.rw;persist();sfx('chest');vib(40);toast(`+${m.rw} 🐟 !`);openMissions()});
  });
}

/* ----- Cadeau du jour ----- */
function giftInfo(){
  const t=dayKey(),y=dayKey(-1);
  const streak=save.daily.last===y?save.daily.streak+1:(save.daily.last===t?save.daily.streak:1);
  const day=((streak-1)%7)+1;
  return{streak,day,reward:day===7?400:40+day*20};
}
function openGift(){
  const ready=save.daily.last!==dayKey();const g=giftInfo();
  const days=Array.from({length:7},(_,i)=>{const d=i+1;const cls=d<g.day||(!ready&&d===g.day)?'d':(d===g.day&&ready?'t':'');return `<b class="${cls}">${d===7?'🎁':'J'+d}</b>`}).join('');
  openSheet(`<div class="card">
    <h2>${ready?'Cadeau du jour !':'Reviens demain !'}</h2>
    <div><span class="chest ${ready?'shake':''}" id="chest">${ready?'🎁':'📦'}</span></div>
    <div class="streak">${days}</div>
    <p>${ready?`Série de ${g.streak} jour${g.streak>1?'s':''}. Le 7e jour, gros cadeau.`:`Série en cours : ${save.daily.streak} jour${save.daily.streak>1?'s':''}. Ne la casse pas… casse plutôt des vases.`}</p>
    <div class="btns">${ready?'<button class="big-btn" id="claim">OUVRIR</button>':''}<button class="ghost" id="x">${ready?'Plus tard':'OK'}</button></div>
  </div>`,dim=>{
    dim.querySelector('#x').onclick=()=>{sfx('click');closeSheet();renderMenu()};
    const c=dim.querySelector('#claim');
    if(c)c.onclick=()=>{audioInit();c.disabled=true;const ch=dim.querySelector('#chest');ch.classList.remove('shake');ch.textContent='✨';sfx('chest');vib([30,30,60]);
      save.daily={last:dayKey(),streak:g.streak};save.coins+=g.reward;persist();
      c.outerHTML=`<div class="reward">+${g.reward} 🐟</div>`;dim.querySelector('#x').textContent='Super !';renderMenu()};
  },true);
}

/* ----- Pause ----- */
let paused=false;
function pause(){
  if(!G||G.state!=='play'||paused||G.over)return;paused=true;holding=false;
  openSheet(`<div class="card"><h2>Pause</h2><p>L'humain n'a rien vu. Pour l'instant.</p>
  <div class="btns"><button class="big-btn" id="res">REPRENDRE</button><button class="ghost" id="quit">Abandonner</button></div></div>`,dim=>{
    dim.querySelector('#res').onclick=()=>{sfx('click');paused=false;closeSheet();last=performance.now()};
    dim.querySelector('#quit').onclick=()=>{sfx('click');paused=false;closeSheet();G.lives=0;endGame()};
  },true);
}

/* =================== ENTRÉES =================== */
function down(e){
  if(!G||G.state!=='play'||paused||root.firstChild)return;
  if(e.target.closest&&e.target.closest('button'))return;
  audioInit();holding=true;
}
function up(){holding=false}
window.addEventListener('pointerdown',down,{passive:true});
window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
window.addEventListener('blur',()=>{holding=false;pause()});
window.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&G&&G.state==='play'&&!paused&&!root.firstChild){audioInit();holding=true;e.preventDefault()}if(e.code==='Escape')pause()});
window.addEventListener('keyup',e=>{if(e.code==='Space')holding=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden){holding=false;pause();AC&&AC.suspend()}else AC&&AC.resume()});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());

$('#playBtn').onclick=()=>{sfx('click');startGame()};
$('#shopBtn').onclick=()=>{audioInit();sfx('click');openShop()};
$('#misBtn').onclick=()=>{audioInit();sfx('click');openMissions()};
$('#giftBtn').onclick=()=>{audioInit();sfx('click');openGift()};
$('#pauseBtn').onclick=()=>{sfx('click');pause()};
$('#sndBtn').onclick=()=>{audioInit();save.sound=!save.sound;persist();applyVol();sfx('click');renderMenu()};
$('#musBtn').onclick=()=>{audioInit();save.music=!save.music;persist();applyVol();sfx('click');renderMenu()};
$('#roomPrev').onclick=()=>{if(save.room>0){save.room--;persist();sfx('click');showMenu()}};
$('#roomNext').onclick=()=>{const n=ROOMS[save.room+1];if(n&&save.total>=n.need){save.room++;persist();sfx('click');showMenu()}};

/* =================== DÉMARRAGE =================== */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused)update(dt);
  updateCam(dt);
  renderer.render(scene,camera);
  drawOverlay();
  requestAnimationFrame(frame);
}
window.addEventListener('resize',resize);
resize();buildOwner();showMenu();camK=1;
$('#loading').remove();
requestAnimationFrame(frame);
if(save.daily.last!==dayKey())setTimeout(()=>{if(G.state!=='play'&&!root.firstChild)openGift()},700);
})();
</script>
</body>
</html>
