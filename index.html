<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Empire SA — Tycoon 3D</title>
    <meta name="description" content="Construis ton empire : achète des commerces, embauche des employés qui travaillent et te rapportent de l'argent." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <div id="fx-layer"></div>

    <header id="hud">
      <div class="brand">
        <div class="logo" data-icon="swiss"></div>
        <div class="brand-text"><b>EMPIRE SA</b><small>Tycoon 3D · Suisse</small></div>
      </div>
      <div class="money-card">
        <div class="cash" id="cash">CHF 0</div>
        <div class="rate"><span id="rate">+CHF 0/s</span><span id="rush-badge" class="rush-badge hidden">x2</span></div>
      </div>
      <div class="chips">
        <div class="chip" title="Employés"><i data-icon="team"></i><b id="st-workers">0</b></div>
        <div class="chip" title="Commerces"><i data-icon="building"></i><b id="st-buildings">0</b></div>
        <div class="chip wide" title="Date et heure"><i id="st-clock-icon"></i><b id="st-clock">Lun 08:00</b><small id="st-week">Sem. 1</small><span id="st-open" class="open-tag">Ouvert</span></div>
        <div class="chip" title="Canton du siège"><i data-icon="shield"></i><b id="st-canton">—</b></div>
      </div>
      <nav class="actions">
        <button id="btn-research" class="btn-main"><i data-icon="bulb"></i><em>Recherche</em><i id="research-dot" class="dot hidden"></i></button>
        <button id="btn-fidu" class="btn-alt" title="Fiduciaire (comptabilité)"><i data-icon="receipt"></i><em>Fiduciaire</em><i id="fidu-dot" class="dot hidden"></i></button>
        <button id="btn-law" title="Cadre légal suisse"><i data-icon="scale"></i></button>
        <button id="btn-stats" title="Statistiques"><i data-icon="stats"></i></button>
        <button id="btn-sound" title="Son"></button>
        <button id="btn-settings" title="Paramètres"><i data-icon="gear"></i></button>
      </nav>
    </header>

    <aside id="panel" class="panel hidden"></aside>
    <div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
    <div id="tutorial" class="tutorial hidden"></div>
    <div id="banner" class="banner hidden"></div>
    <div id="toasts"></div>
    <div id="tooltip" class="tooltip hidden"></div>
    <div id="controls-hint">Glisser : tourner · Clic droit : déplacer · Molette : zoom · ZQSD / WASD : se déplacer</div>

    <div id="loader">
      <div class="loader-inner">
        <div class="logo big" data-icon="swiss"></div>
        <h1>EMPIRE SA</h1>
        <p>Construction de ta ville…</p>
        <div class="bar"><div id="loader-bar"></div></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
